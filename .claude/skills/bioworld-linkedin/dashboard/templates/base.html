<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Bioworld Content Hub{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bw: {
          teal: '#274060',
          'teal-dark': '#1B2845',
          'teal-deep': '#1B2845',
          'teal-light': '#e0edf9',
          'teal-50': '#eef5fc',
          dark: '#1B2845',
          card: '#ffffff',
          border: '#c4d8ed',
          muted: '#5a7a9b',
          text: '#1B2845',
          'text-light': '#3d5a80',
          hover: '#e0edf9',
        }
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .status-discovered { background: #e0edf9; color: #274060; }
  .status-shortlisted { background: #d0e4f7; color: #274060; }
  .status-draft-ready { background: #e8e0f5; color: #5b3e8a; }
  .status-pending-approval { background: #fef3c7; color: #92600a; }
  .status-approved { background: #dcfce7; color: #166534; }
  .status-published { background: #d1fae5; color: #065f46; }
  .status-rejected { background: #fee2e2; color: #991b1b; }

  .nav-link { transition: all 0.15s; color: rgba(255,255,255,0.6); }
  .nav-link:hover { background: rgba(255,255,255,0.1); color: #ffffff; }
  .nav-link.active { background: rgba(101,175,255,0.2); color: #ffffff; }
</style>
</head>
<body class="h-full bg-[#eef4fb] text-bw-text">
<div class="flex h-full">

  <!-- Sidebar -->
  <nav class="w-56 bg-[#335C81] flex flex-col min-h-screen fixed">
    <div class="px-5 py-5 border-b border-white/10">
      <img src="{{ url_for('static', filename='logo-dark.png') }}" alt="Bioworld Ventures" class="h-6">
      <div class="text-[10px] text-[#65AFFF] font-medium uppercase tracking-[0.15em] mt-2">Content Hub</div>
    </div>

    <div class="flex-1 py-4 px-3 space-y-0.5">
      <a href="/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium {% if request.endpoint == 'dashboard' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Overview
      </a>
      <a href="/feed" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium {% if request.endpoint == 'feed_page' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7m-6 0a1 1 0 110-2 1 1 0 010 2z"/></svg>
        Feed
      </a>
      <a href="/articles" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium {% if request.endpoint == 'articles_page' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        Articles
      </a>
      <a href="/drafts" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium {% if request.endpoint == 'drafts_page' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        Review & Schedule
      </a>
      <a href="/brands" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13px] font-medium {% if request.endpoint == 'brands_page' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        Portfolio
      </a>
    </div>

    <div class="p-4 border-t border-white/10">
      <div class="flex items-center gap-2.5">
        {% if session.get('user_picture') %}
        <img src="{{ session.user_picture }}" class="w-7 h-7 rounded-full" alt="">
        {% else %}
        <div class="w-7 h-7 rounded-full bg-[#65AFFF]/20 flex items-center justify-center">
          <span class="text-[11px] font-semibold text-[#65AFFF]">{{ session.get('user_name', 'D')[0] }}</span>
        </div>
        {% endif %}
        <div class="flex-1 min-w-0">
          <div class="text-[12px] font-medium text-white/70 truncate">{{ session.get('user_name', 'Dev') }}</div>
        </div>
        <a href="/logout" class="text-white/30 hover:text-white/60 transition" title="Sign out">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="flex-1 ml-56 overflow-auto min-h-screen">
    <div class="px-10 py-8 max-w-[1200px]">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
{% block scripts %}{% endblock %}
</body>
</html>
