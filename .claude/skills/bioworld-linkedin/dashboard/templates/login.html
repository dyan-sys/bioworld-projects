<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bioworld LinkedIn Hub — Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="min-h-screen bg-[#faf8f4] flex items-center justify-center">

<div class="bg-white border border-[#e8e4de] rounded-2xl p-12 w-full max-w-sm text-center">
  <div class="mb-2">
    <div class="font-['DM_Serif_Display'] text-2xl text-[#1a1a2e] tracking-tight">Bioworld Ventures</div>
  </div>
  <div class="font-['JetBrains_Mono'] text-[10px] text-[#6b7280] uppercase tracking-[0.18em] mb-8">Content Hub</div>

  {% if error %}
  <div class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600">
    {{ error }}
  </div>
  {% endif %}

  <p class="text-[#6b7280] text-sm mb-8">Sign in with your @withally.com account</p>

  <div id="g_id_onload"
       data-client_id="{{ client_id }}"
       data-login_uri="{{ url_for('auth_callback', _external=True) }}"
       data-auto_prompt="false">
  </div>
  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="sign_in_with"
       data-shape="rectangular"
       data-logo_alignment="left"
       data-width="280">
  </div>

  <p class="text-[#d5d0c8] text-xs mt-10">Bioworld Ventures &middot; LinkedIn Content Management</p>
</div>

</body>
</html>
